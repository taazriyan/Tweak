<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tweak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout (Figma "Section 2"): main card = sidebar 281 + board; side column 366 = progress ring (258) + client message. Empty state hides the side column. Light theme only, as designed. */
:root{
  --page:#F4F3F3; --card:#FFFFFF; --line:#E0E0E0; --hair:#F4F4F4; --stroke:#EFEFEF; --soft:#F0F0F0; --search:#F8F8F9; --selected:#F4F3F3; --btn:#F4F3F3;
  --text:#1E1E1E; --text-2:#939495; --text-3:#696B6D; --chip-text:#646566; --muted:#727272; --strong:#101010; --icon:#141B34;
  --blue:#667FFF; --blue-hover:#5870F2;
  --ask-bg:#FFF5DF; --ask:#F0702B; --done-bg:#DEFFD4; --done:#10C331; --all-bg:#FFD9FA; --all:#E72CEA; --green:#00BE6E;
  --hl-bg:#FEF3C6; --hl:#F0A00D; --ring:#28FF15; --ring-track:#F4F3F3; --scroll:#E9E7E7; --hover:#FAFAFA; --quote-hover:#E9E9E9;
  --c-change:#FF6500; --c-change-bg:#FFEDDA; --c-bug:#FD4842; --c-bug-bg:#FFE8DA; --c-new:#627EFF; --c-new-bg:#E4F8FF;
  --c-fix:#E825DB; --c-fix-bg:#FFD4F1; --c-add:#0EA394; --c-add-bg:#DCF7F2; --c-revamp:#8D4BFF; --c-revamp-bg:#F2E5FF;
  --backdrop:rgba(54,54,54,.5); --drop:rgba(241,241,241,.5); --toast:#1E1E1E; --toast-link:#A9B7FF;
  --f-ui:"General Sans","Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%}
body{background:var(--page);color:var(--text);font:400 14px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.page{height:100%;min-height:640px;max-width:1440px;margin:0 auto;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 366px;gap:16px}
.page.solo{grid-template-columns:minmax(0,1fr)}
.page.solo .side{display:none}

/* ---------- main card ---------- */
.main{position:relative;background:var(--card);border-radius:20px;overflow:hidden;display:flex;min-width:0;min-height:0}
.sidebar{flex:0 0 auto;width:281px;padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px;overflow:auto;transition:width .3s ease,padding .3s ease,opacity .2s ease}
.main.collapsed .sidebar{width:0;padding-left:0;padding-right:0;border-right-width:0;opacity:0;overflow:hidden}
.logo{display:block;width:67px;height:18px;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:16px;min-width:240px}
.add-proj{height:36px;display:flex;align-items:center;gap:8px;padding:2px 12px;border:0;border-radius:10px;background:transparent;font-weight:500;font-size:14px;line-height:16px;color:var(--text);text-align:left}
.add-proj:hover{background:var(--hover)}
.divider{height:1px;background:var(--hair)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prow{width:100%;display:flex;align-items:center;gap:8px;padding:2px 2px 2px 12px;border:0;border-radius:41px;background:transparent;text-align:left}
.pitem{position:relative}
.pitem:hover .prow{background:var(--hover)}
.prow[aria-current="true"]{background:var(--selected);border-radius:10px}
.prow .pin-ico{display:inline-flex;flex-shrink:0}
.pmore{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:41px;background:transparent;display:grid;place-items:center;padding:0;opacity:0;pointer-events:none;transition:opacity .12s ease,background-color .12s ease}
.pitem:hover .pmore,.pitem.menu-open .pmore,.ritem:hover .pmore,.ritem.menu-open .pmore,.pmore:focus-visible{opacity:1;pointer-events:auto}
.pitem:hover .holder,.pitem.menu-open .holder,.pitem:has(.pmore:focus-visible) .holder{visibility:hidden}
.prow.editing{background:var(--selected);border-radius:10px;padding:4px}
.pname-input{flex:1 1 auto;min-width:0;height:28px;border:1px solid var(--blue);border-radius:8px;padding:0 8px;background:var(--card);font-weight:500;font-size:14px;line-height:16px;color:var(--text);outline:none}
.pmenu{position:fixed;z-index:70;min-width:168px;padding:6px;background:var(--card);border:1px solid var(--stroke);border-radius:12px;box-shadow:0 10px 30px rgba(30,30,30,.12);display:flex;flex-direction:column;gap:2px}
.pmenu button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-weight:500;font-size:14px;line-height:16px;color:var(--text);text-align:left;white-space:nowrap}
.pmenu button:hover,.pmenu button:focus-visible{background:var(--hover);outline:none}
.pmenu button.danger{color:var(--c-bug)}
.pmenu .mi{display:inline-flex;flex-shrink:0}
@media (hover:none){.pmore{opacity:1;pointer-events:auto}.pitem .holder{visibility:hidden}}
.prow .pname{flex:1 1 auto;min-width:0;font-weight:500;font-size:14px;line-height:16px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .holder{width:32px;height:32px;border-radius:41px;background:var(--card);display:grid;place-items:center;flex-shrink:0}
.prow[aria-current="true"] .holder{background:transparent}
.prow .spin{width:16px;height:16px;color:var(--blue)}
.p-empty{margin:0;padding:4px 12px;font-size:13px;line-height:18px;color:var(--text-2)}
.collapse-btn{position:absolute;top:25px;left:265px;z-index:4;width:32px;height:32px;border:0;border-radius:33px;background:var(--btn);display:grid;place-items:center;padding:0;transition:left .3s ease,background-color .15s}
.collapse-btn:hover{background:#ECEBEB}
.main.collapsed .collapse-btn{left:16px}

/* ---------- board ---------- */
.board{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:85px;transition:padding .3s ease}
.main.collapsed .bar{padding-left:64px}
.tabs{display:flex;gap:2px;padding:2px;border-radius:56px;background:rgba(244,243,243,.44);flex-shrink:0;max-width:100%;overflow-x:auto}
.tab{height:40px;padding:10px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:39px;background:transparent;font-weight:500;font-size:14px;line-height:16px;color:var(--text);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);border-color:#F3F3F4;filter:drop-shadow(0 4px 4px rgba(0,0,0,.07))}
.count{font:500 11.5px/11.5px var(--f-mono);padding:4px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.count.open{background:var(--blue);color:#FFFFFF} .count.ask{background:var(--ask-bg);color:var(--ask)}
.count.done{background:var(--done-bg);color:var(--done)} .count.all{background:var(--all-bg);color:var(--all)}
.search{flex:1 1 180px;min-width:0;height:44px;background:var(--search);border-radius:39px;padding:10px 12px;display:flex;align-items:center;gap:8px;overflow:hidden;cursor:text}
.search svg{flex-shrink:0}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;line-height:normal;padding:0;outline:none}
.search input::placeholder{color:var(--text-2)}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--blue)}
.list{flex:1 1 auto;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
.list::-webkit-scrollbar{display:block;width:10px}
.list::-webkit-scrollbar-track{background:var(--card)}
.list::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:29px;border:2px solid var(--card)}

.row{display:flex;flex-direction:column;gap:16px;padding:24px;border-bottom:1px solid var(--line);background:var(--card);transition:background-color .15s ease}
.row.fresh{animation:fresh 2.6s ease-out backwards}
@keyframes fresh{0%,55%{background:#F0F3FF}100%{background:var(--card)}}
.row:hover,.row:focus-within{background:var(--hover)}
.r-top{display:flex;gap:16px;align-items:flex-start}
.row > .quote{margin-top:-6px}
.r-head{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.r-title{display:flex;gap:12px;align-items:center;width:100%}
.pin{flex-shrink:0;display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;background:var(--soft);border-radius:12px 12px 12px 3px;font-weight:500;font-size:11.5px;line-height:11.5px;color:var(--text);font-variant-numeric:tabular-nums}
.title{margin:0;padding-top:1px;font-weight:500;font-size:16px;line-height:20px;color:var(--text);overflow-wrap:anywhere}
.row[data-status="done"] .title{color:var(--text-2);text-decoration:line-through}
.quote{margin:0;align-self:flex-start;max-width:100%;background:var(--soft);border:0;border-radius:6px;padding:3px 8px;font-size:14px;line-height:18px;color:var(--text-3);overflow-wrap:anywhere;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.quote:hover{background:var(--quote-hover)}
.quote[aria-pressed="true"]{background:var(--hl-bg);color:var(--hl)}
@supports (text-box:trim-both cap alphabetic){.quote{padding:6px 8px;text-box:trim-both cap alphabetic}}
.r-icons{display:flex;gap:4px;flex-shrink:0}
.ib{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;padding:0}
.ib:hover{background:var(--selected)}
.ib.del:hover{background:var(--c-bug-bg)}
.ib[aria-pressed="true"]{background:var(--selected)}
.ib[aria-pressed="true"] svg path{stroke:var(--text)}
.r-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chips{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;font-weight:500;font-size:12px;line-height:12px;white-space:nowrap}
.chip.screen{background:var(--card);border:1px solid var(--stroke);color:var(--chip-text)}
.chip i{width:7px;height:7px;border-radius:3.5px;background:currentColor}
.ty-change{background:var(--c-change-bg);color:var(--c-change)} .ty-bug{background:var(--c-bug-bg);color:var(--c-bug)}
.ty-new{background:var(--c-new-bg);color:var(--c-new)} .ty-fix{background:var(--c-fix-bg);color:var(--c-fix)}
.ty-add{background:var(--c-add-bg);color:var(--c-add)} .ty-revamp{background:var(--c-revamp-bg);color:var(--c-revamp)}
.chip.ask{background:var(--ask-bg);color:var(--ask)}
.resolve{height:32px;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 8px;border:0;border-radius:10px;background:var(--btn);font-weight:500;font-size:14px;line-height:16px;color:var(--text);white-space:nowrap}
.resolve:hover{background:#ECEBEB}
.resolve[aria-pressed="true"]{background:var(--done-bg);color:#0C9A27}
.resolve[aria-pressed="true"] svg path{stroke:#0C9A27}
.empty-tab{padding:48px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.empty-tab h3{margin:0;font-weight:500;font-size:16px;line-height:20px}
.empty-tab p{margin:0;font-size:14px;line-height:20px;color:var(--text-3);max-width:44ch}

/* empty state */
.blank{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 24px 84px}
.blank img{width:366px;max-width:80%;height:auto;user-select:none;-webkit-user-drag:none;margin-bottom:-24px}
.blank p{margin:0;font-size:14px;line-height:20px;color:var(--text-3);text-align:center;max-width:40ch}

/* creating animation */
.creating{flex:1 1 auto;display:grid;place-items:center;padding:24px;overflow:hidden}
.scan{position:relative;width:420px;max-width:100%;height:300px}
.cov{position:absolute;left:50%;top:0;transform:translateX(-58%);z-index:3;height:32px;display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 12px;border-radius:6px;background:linear-gradient(90deg,#8A9BFF,#667FFF);color:#FFFFFF;font-weight:500;font-size:14px;box-shadow:0 6px 16px rgba(102,127,255,.25);white-space:nowrap}
.cov svg{width:16px;height:16px;animation:spin 1.1s linear infinite}
.cov b{font-weight:500;font-variant-numeric:tabular-nums}
.vline{position:absolute;left:50%;top:30px;bottom:0;width:2px;margin-left:-1px;background:var(--blue);z-index:2}
.glow{position:absolute;right:50%;top:60px;bottom:20px;width:70px;background:linear-gradient(90deg,rgba(102,127,255,0),rgba(102,127,255,.28));filter:blur(6px);z-index:1}
.lane{position:absolute;left:0;right:0;height:36px}
.ghost{position:absolute;top:0;height:36px;border-radius:999px;background:repeating-linear-gradient(90deg,#E4E4E7 0 6px,#EDEDEF 6px 9px);filter:blur(1.6px);opacity:.9;animation:flow 2.4s linear infinite}
@keyframes flow{0%{transform:translateX(-60px);opacity:0}15%{opacity:.9}80%{opacity:.9}100%{transform:translateX(120px);opacity:0}}
.res{position:absolute;left:50%;top:0;height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:500;font-size:14px;color:var(--text);white-space:nowrap;z-index:2;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.res svg{width:18px;height:18px;flex-shrink:0}
@keyframes pop{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.sparks{position:absolute;right:50%;top:70px;bottom:30px;width:60px;background-image:radial-gradient(#FFFFFF 1px,transparent 1.6px);background-size:12px 14px;opacity:.9;z-index:2;animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- side column ---------- */
.side{display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0;overflow:auto}
.round-card{flex:0 0 auto;max-height:340px;min-height:0;background:var(--card);border-radius:20px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:12px}
.round-card .msg-head{padding:0 8px}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0}
.rrow{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border:0;border-radius:10px;background:transparent;text-align:left}
.rlist li:hover .rrow{background:var(--hover)}
.rrow[aria-current="true"]{background:var(--selected)}
.ritem{position:relative}
.ritem .rrow{padding-right:44px}
.ritem .pmore{right:8px}
.rrow .pin-ico{display:inline-flex;flex-shrink:0}
.rtext{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.rname{font-weight:500;font-size:14px;line-height:16px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{font-size:12px;line-height:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .holder{width:32px;height:32px;border-radius:41px;background:var(--selected);display:grid;place-items:center;flex-shrink:0}
.rrow[aria-current="true"] .holder{background:var(--card)}
.rrow .spin{width:16px;height:16px;color:var(--blue)}
.msg-round{flex-shrink:1;min-width:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 8px;border:1px solid var(--stroke);border-radius:999px;font-weight:500;font-size:12px;line-height:12px;color:var(--chip-text)}
.msg-card{flex:1 1 auto;min-height:240px;background:var(--card);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
.msg-head{display:flex;align-items:center;gap:12px}
.msg-head h2{flex:1;margin:0;font-weight:600;font-size:18px;line-height:16px;color:var(--text)}
.msg-body{flex:1 1 auto;min-height:0;overflow:auto;font-size:16px;line-height:20px;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.msg-body .when{display:block;margin:16px 0 6px;font-size:12px;line-height:16px;color:#B2B2B2;white-space:normal}
.msg-body .when:first-child{margin-top:0}
.msg-body mark{background:var(--hl-bg);color:var(--hl);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.badge{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;margin-left:4px;border-radius:12px 12px 12px 3px;background:var(--hl);color:#FFFFFF;font:500 12px/11.5px var(--f-mono);vertical-align:1px;filter:drop-shadow(0 4px 2.45px rgba(0,0,0,.08))}
.msg-empty{color:var(--text-2);font-size:14px}

/* ---------- buttons, inputs ---------- */
.btn{height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#FFFFFF;font-weight:500;font-size:16px;line-height:17.25px;white-space:nowrap}
.btn:hover{background:var(--blue-hover)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.sm{height:36px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:500;font-size:14px}
.input,.textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);font-size:14px;line-height:20px;color:var(--text)}
.input{height:50px;border-radius:35px;padding:0 20px}
.textarea{height:154px;border-radius:16px;padding:14px 16px;resize:none;display:block}
.input::placeholder,.textarea::placeholder{color:var(--text-2)}
.input:focus,.textarea:focus{outline:none;border-color:var(--blue)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block;flex-shrink:0}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--backdrop);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:594px;max-width:100%;max-height:100%;overflow:auto;background:var(--card);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:22px}
.m-head{display:flex;align-items:center;gap:22px}
.m-head h2{flex:1;margin:0;font-weight:600;font-size:18px;line-height:16px}
.x{width:32px;height:32px;margin:-6px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;padding:0}
.x:hover{background:var(--selected)}
.m-fields{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.label{padding:0 8px;font-weight:500;font-size:14px;line-height:16px;color:var(--text)}
.dropzone{border-radius:16px;background:var(--drop);padding:24px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:1.5px dashed transparent;transition:border-color .15s,background-color .15s}
.dropzone.over{border-color:var(--blue);background:#F0F3FF}
.dz-text{font-size:14px;line-height:1.5;letter-spacing:.035px;color:var(--muted)}
.dz-text .link{color:var(--strong);font-size:14px}
.fcard{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;align-items:center;gap:24px;min-width:0}
.finfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.fname{font-weight:600;font-size:16px;line-height:1.4;letter-spacing:.024px;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.2;letter-spacing:.07px;color:var(--muted)}
.fmeta .ok{color:var(--done)} .fmeta .warn{color:var(--ask)}
.m-note{margin:0;padding:10px 12px;border-radius:12px;background:var(--ask-bg);font-size:13px;line-height:18px}
.m-sub{margin:-16px 0 0;font-size:14px;line-height:18px;color:var(--text-2)}
.m-hint{margin:0;padding:0 8px;font-size:13px;line-height:18px;color:var(--text-2)}
.textarea.tall{height:260px}
.input[readonly]{background:var(--hover);color:var(--text-3)}
.input[readonly]:focus{border-color:var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:16px;background:var(--toast);color:#FFFFFF;padding:12px 16px;border-radius:12px;font-size:14px;line-height:18px;box-shadow:0 6px 18px rgba(30,30,30,.15);max-width:calc(100% - 32px)}
.toast .link{color:var(--toast-link)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .page{height:auto;grid-template-columns:minmax(0,1fr)}
  .main{height:820px}
  .side{flex-direction:row;flex-wrap:wrap;overflow:visible}
  .round-card{flex:0 1 366px;max-height:420px}
  .msg-card{flex:1 1 320px;height:420px}
}
@media (max-width:820px){
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
  .main{flex-direction:column;height:auto;min-height:70vh}
  .collapse-btn{display:none}
  .sidebar,.main.collapsed .sidebar{width:100%;padding:20px;opacity:1;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .nav{min-width:0}
  .main.collapsed .bar,.bar{padding-left:20px;padding-right:20px}
  .list{overflow:visible}
  .side{flex-direction:column;flex-wrap:nowrap}
  .round-card{flex:0 0 auto;max-height:360px}
  .msg-card{flex:0 0 auto;height:auto;max-height:520px}
  .modal{padding:24px}
}
@media (max-width:520px){
  .row{padding:20px 16px}
  .r-top{flex-direction:column;gap:8px}
  .r-icons{align-self:flex-end;order:-1;margin-bottom:-8px}
}
@media (prefers-reduced-motion:reduce){.row.fresh,.ghost,.res,.sparks{animation:none}.spin,.cov svg{animation-duration:2.4s}}

    pmenu.style.left = left + 'px'; pmenu.style.top = top + 'px';
    anchor.setAttribute('aria-expanded', 'true');
    anchor.parentElement.classList.add('menu-open');
    pmenu.querySelector('button').focus();
  }
  function closeMenu() {
    if (!state.menuFor && pmenu.hidden) return;
    state.menuFor = null; pmenu.hidden = true;
    document.querySelectorAll('.menu-open').forEach((li) => li.classList.remove('menu-open'));
    document.querySelectorAll('.pmore[aria-expanded="true"]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
  }
  pmenu.addEventListener('keydown', (e) => {
    const items = [...pmenu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus(); }
    else if (e.key === 'Tab') closeMenu();
  });
  document.addEventListener('pointerdown', (e) => { if (state.menuFor && !pmenu.contains(e.target) && !e.target.closest('.pmore')) closeMenu(); });
  window.addEventListener('resize', closeMenu);
  $('#sidebar').addEventListener('scroll', closeMenu);

  function startRename(name) {
    if (state.readOnly) return;
    closeMenu();
    state.renamingProj = name;
    render();
  }
  async function commitRename(oldName, value) {
    const name = String(value || '').trim().replace(/\s+/g, ' ').slice(0, 80);
    state.renamingProj = null;
    if (!name || name === oldName) { render(); return; }
    if (projects().some((p) => p.name === name)) { render(); toast('Another project already has this name.'); return; }
    try { await renameProject(oldName, name); toast(`Renamed to "${name}".`); } catch {}
    render();
  }
  // move every task, round and pin of a project to a new name
  async function renameProject(oldName, name) {
    const ts = state.tasks.filter((t) => (t.project || '').trim() === oldName), bs = projectBatches(oldName);
    state.renaming = name; state.renamingFrom = oldName;
    if (state.proj === oldName) { state.proj = name; pref.set('proj', name); }
    setTimeout(() => { if (state.renaming === name) { state.renaming = null; state.renamingFrom = null; render(); } }, 4000);
    render();
    await Promise.all([
      ...ts.map((t) => write('tasks', t.id, { project: name, updatedAt: Date.now() }, 'update')),
      ...bs.map((b) => write('batches', b.id, { project: name }, 'update'))
    ]);
    const pins = pinnedList();
    if (pins.includes(oldName)) await setPinned(pins.map((n) => (n === oldName ? name : n)));
  }
  function togglePinProject(name) {
    const pins = pinnedList();
    setPinned(pins.includes(name) ? pins.filter((n) => n !== name) : [name, ...pins]).catch(() => {});
  }
  async function deleteProject(name) {
    const ts = state.tasks.filter((t) => (t.project || '').trim() === name), bs = projectBatches(name);
    const saved = [...ts.map(({ id, ...d }) => ['tasks', id, d]), ...bs.map(({ id, ...d }) => ['batches', id, d])];
    const wasPinned = pinnedList().includes(name), wasOpen = state.proj === name;
    state.deleting = name;
    if (wasOpen) { state.proj = ''; state.round = 'all'; state.hl = null; }
    render();
    try {
      await Promise.all(saved.map(([c, id]) => write(c, id, null, 'delete')));
      if (wasPinned) await setPinned(pinnedList().filter((n) => n !== name));
    } catch { state.deleting = null; render(); return; }
    state.deleting = null;
    render();
    toast(`Deleted "${name}"`, 'Undo', async () => {
      await Promise.allSettled(saved.map(([c, id, d]) => write(c, id, d, 'set')));
      if (wasPinned) await setPinned([name, ...pinnedList().filter((n) => n !== name)]).catch(() => {});
      if (wasOpen) { state.proj = name; pref.set('proj', name); }
      render();
      toast(`Restored "${name}".`);
    });
  }

  /* ---------- render: tabs ---------- */
  function renderTabs() {
    const base = filtered(), el = $('#tabs'); el.textContent = '';
    for (const [k, label] of [['open', 'Open'], ['ask', 'Ask client'], ['done', 'Done'], ['all', 'All'], ['pinned', 'Pinned']]) {
      const n = base.filter((t) => inTab(t, k)).length;
      el.append(h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(state.tab === k), onclick: () => { state.tab = k; render(); } },
        label, k === 'pinned' ? null : h('span', { class: 'count ' + k }, String(n))));
    }
  }

  /* ---------- render: rows ---------- */
  function row(t) {
    const type = typeOf(t), done = t.status === 'done';
    const el = h('div', { class: 'row', 'data-status': t.status || 'todo', 'data-id': t.id });
    const born = state.fresh.get(t.id);
    if (born) { el.classList.add('fresh'); el.style.animationDelay = -(Date.now() - born) + 'ms'; }
    const head = h('div', { class: 'r-head' },
      h('div', { class: 'r-title' }, h('span', { class: 'pin' }, String(t.num ?? '–')),
        h('p', { class: 'title' }, t.text)));
    const quote = !t.quote ? null : (h('button', { class: 'quote', type: 'button', 'aria-pressed': String(state.hl === t.id), title: state.hl === t.id ? 'Hide the highlight' : 'Show in the client message', onclick: () => setHighlight(state.hl === t.id ? null : t.id) }, t.quote));
    // the reference sits below the title row so it spans the full width, under the buttons too
    const icons = state.readOnly ? null : h('div', { class: 'r-icons' },
      h('button', { class: 'ib del', type: 'button', html: ICON.trash, title: 'Delete', 'aria-label': `Delete #${t.num}`, onclick: () => removeTask(t) }),
      h('button', { class: 'ib', type: 'button', html: ICON.pin, 'aria-pressed': String(!!t.pinned), title: t.pinned ? 'Unpin' : 'Pin', 'aria-label': t.pinned ? `Unpin #${t.num}` : `Pin #${t.num}`, onclick: () => togglePin(t) }),
      h('button', { class: 'ib', type: 'button', html: ICON.copy, title: 'Copy task', 'aria-label': `Copy #${t.num}`, onclick: () => copyTask(t) }));
    el.append(h('div', { class: 'r-top' }, head, icons));
    if (quote) el.append(quote);
    el.append(h('div', { class: 'r-bottom' },
      h('div', { class: 'chips' },
        t.screen ? h('span', { class: 'chip screen' }, t.screen) : null,
        h('span', { class: 'chip ty-' + type }, h('i'), TYPES[type]),
        t.status === 'ask' ? h('span', { class: 'chip ask' }, 'Ask client') : null),
      state.readOnly ? null : h('button', { class: 'resolve', type: 'button', 'aria-pressed': String(done), title: done ? 'Reopen this task' : 'Mark as resolved', 'aria-label': done ? `#${t.num} is resolved. Reopen it` : `Mark #${t.num} as resolved`, onclick: () => toggleDone(t) },
        h('span', { html: ICON.tick, style: 'display:inline-flex' }), 'Resolved')));
    return el;
  }

  function creatingView() {
    const c = state.creating;
    const wrap = h('div', { class: 'creating', role: 'status', 'aria-live': 'polite' });
    const scan = h('div', { class: 'scan' });
    scan.append(h('div', { class: 'cov' }, h('span', { html: ICON.covRing, style: 'display:inline-flex' }), 'Coverage ', h('b', { id: 'covPct' }, Math.round(c.pct) + '%')));
    scan.append(h('div', { class: 'glow' }), h('div', { class: 'vline' }), h('div', { class: 'sparks' }));
    const tops = [66, 116, 166, 216];
    const ghostSets = [[[45, 150]], [[0, 90], [100, 100]], [[0, 80], [95, 105]], [[40, 150]]];
    tops.forEach((top, i) => {
      const lane = h('div', { class: 'lane', style: `top:${top}px` });
      ghostSets[i].forEach(([x, w], j) => lane.append(h('div', { class: 'ghost', style: `left:${x}px;width:${w}px;animation-delay:${-(i * 0.5 + j * 0.9)}s` })));
      if (c.items) {
        const items = c.items, label = i === 3 && items.length > 4 ? `+${items.length - 3} more tasks` : items[i];
        if (label) lane.append(h('div', { class: 'res', style: `animation-delay:${i * 0.22}s;max-width:50%` }, h('span', { style: 'overflow:hidden;text-overflow:ellipsis' }, label), h('span', { html: ICON.check, style: 'display:inline-flex' })));
      }
      scan.append(lane);
    });
    wrap.append(scan);
    return wrap;
  }

  function renderList() {
    const list = $('#list'); list.textContent = '';
    const ps = projects();
    if (!ps.length && !state.creating) {
      list.append(h('div', { class: 'blank' },
        h('img', { src: EMPTY_IMG, alt: '', width: '366', height: '415', draggable: 'false' }),
        state.loaded ? (state.readOnly ? h('p', null, 'No projects yet.') : h('button', { class: 'btn', type: 'button', onclick: () => openModal('project') }, 'Add A Project')) : h('p', null, 'Loading your projects…')));
      return;
    }
    if (state.creating && state.creating.project === state.proj) { list.append(creatingView()); return; }
    const ts = filtered().filter((t) => inTab(t, state.tab)).sort((a, b) => (Number(!!b.pinned) - Number(!!a.pinned)) || (a.num || 0) - (b.num || 0));
    if (!ts.length) {
      const msgs = {
        open: ['All resolved', state.round === 'all' ? 'Every task in this project is resolved. Use + on Feedback Phase when the client sends the next phase.' : 'Every task in this phase is resolved.'],
        ask: ['Nothing to ask the client', 'Questions the client needs to answer collect here.'],
        done: ['Nothing resolved yet', 'Press Resolved on a task and it moves here.'],
        all: ['No tasks yet', 'Use + on Feedback Phase to add the client\'s feedback.'],
        pinned: ['No pinned tasks', 'Use the pin button on a task to keep it at the top.']
      };
      const [t1, t2] = state.q ? ['No matches', `No tasks match "${state.q}".`] : msgs[state.tab];
      list.append(h('div', { class: 'empty-tab' }, h('h3', null, t1), h('p', null, t2)));
      return;
    }
    ts.forEach((t) => list.append(row(t)));
  }

  /* ---------- render: client message ---------- */
  function setHighlight(id) {
    if (state.hl === id) return;
    state.hl = id;
    document.querySelectorAll('.quote[aria-pressed]').forEach((q) => {
      const on = !!id && q.closest('.row')?.dataset.id === id;
      q.setAttribute('aria-pressed', String(on));
      q.title = on ? 'Hide the highlight' : 'Show in the client message';
    });
    renderMessage(!!id);
    if (id) {
      const card = document.querySelector('.msg-card'), r = card && card.getBoundingClientRect();
      if (r && (r.top < 0 || r.top > innerHeight - 120)) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  function findRange(raw, quote) {
    if (!quote) return null;
    const map = []; let norm = '';
    for (let i = 0; i < raw.length; i++) { const ch = raw[i]; if (/\s/.test(ch)) { if (norm.endsWith(' ')) continue; norm += ' '; } else norm += ch.toLowerCase(); map.push(i); }
    const q = quote.toLowerCase().replace(/\s+/g, ' ').trim().replace(/[.!?।,]+$/, '');
    if (q.length < 4) return null;
    let i = norm.indexOf(q), len = q.length;
    if (i < 0) { const part = q.split(' ').slice(0, 6).join(' '); if (part.length >= 12) { i = norm.indexOf(part); len = part.length; } }
    if (i < 0) return null;
    const start = map[i], endIdx = map[Math.min(i + len - 1, map.length - 1)];
    let end = endIdx + 1;
    while (end < raw.length && /[.!?।]/.test(raw[end])) end++;
    return [start, end];
  }
  function renderMessage(scroll) {
    const body = $('#msgBody'); body.textContent = '';
    let bs = projectBatches(state.proj);
    const names = new Map(bs.map((b, i) => [b.id, roundName(b, i)]));
    if (state.creating && state.creating.project === state.proj && state.creating.raw) {
      bs.push({ id: '__new', raw: state.creating.raw, createdAt: Date.now() });
      names.set('__new', state.creating.roundName);
    }
    if (state.round !== 'all') bs = bs.filter((b) => b.id === state.round);
    const chip = $('#msgRound');
    chip.hidden = state.round === 'all' || !names.has(state.round);
    chip.textContent = names.get(state.round) || '';
    if (!bs.length) { body.append(h('span', { class: 'msg-empty' }, 'The client\'s message for this project shows here.')); return; }
    const t = state.hl ? state.tasks.find((x) => x.id === state.hl && (x.project || '').trim() === state.proj) : null;
    // find the quote in the task's own message first, then in the rest (messages merge when edited)
    let target = null;
    if (t && t.quote) {
      const own = bs.find((b) => b.id === t.batchId);
      for (const b of own ? [own, ...bs.filter((x) => x !== own)] : bs) {
        const r = findRange(String(b.raw || ''), t.quote);
        if (r) { target = { id: b.id, r }; break; }
      }
    }
    let markEl = null;
    for (const b of bs) {
      if (bs.length > 1) body.append(h('span', { class: 'when' }, [names.get(b.id), fmtWhen(b.createdAt), b.source].filter(Boolean).join(' · ')));
      const raw = String(b.raw || '');
      const range = target && target.id === b.id ? target.r : null;
      if (range) {
        body.append(raw.slice(0, range[0]));
        markEl = h('mark', null, raw.slice(range[0], range[1]));
        body.append(markEl, h('span', { class: 'badge' }, String(t.num)), raw.slice(range[1]));
      } else body.append(raw);
      body.append('\n');
    }
    if (scroll && markEl) {
      const top = markEl.offsetTop - body.offsetTop - 60;
      if (top < body.scrollTop || top > body.scrollTop + body.clientHeight - 80) body.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }
  }

  /* ---------- render: feedback rounds ---------- */
  function selectRound(id) {
    if (state.round === id) return;
    state.round = id; state.keepRound = null; state.hl = null; state.tab = 'open';
    render();
  }
  function renderRounds() {
    const list = $('#roundList'); list.textContent = '';
    const all = allProjTasks();
    const bs = projectBatches(state.proj).map((b, i) => [b, i]).filter(([b]) => b.id !== state.deletingRound);
    const canEdit = !state.readOnly && !state.creating;
    const item = (id, name, meta, opts) => {
      const key = 'r:' + id, withMenu = opts.menu && canEdit;
      const li = h('li', { class: withMenu ? 'ritem' + (state.menuFor === key ? ' menu-open' : '') : null },
        h('button', { class: 'rrow', type: 'button', 'aria-current': String(state.round === id), title: opts.busy ? 'Creating tasks…' : null, onclick: () => selectRound(id) },
          h('span', { class: 'rtext' }, h('span', { class: 'rname' }, name), h('span', { class: 'rmeta' }, meta)),
          opts.pinned ? h('span', { class: 'pin-ico', title: 'Pinned', html: MI.pinSmall }) : null));
      if (withMenu) li.append(h('button', { class: 'pmore', type: 'button', html: ICON.dots, title: 'More', 'data-key': key, 'aria-label': `More options for ${name}`, 'aria-haspopup': 'menu', 'aria-expanded': String(state.menuFor === key),
        onclick: (e) => { e.stopPropagation(); if (state.menuFor === key) closeMenu(); else openMenu(key, e.currentTarget, phaseMenuItems(id)); } }));
      return li;
    };
    // pinned phases first, then newest first
    const rows = bs.map(([b, i]) => ({ id: b.id, name: roundName(b, i), at: b.createdAt || 0, pinned: !!b.pinned }));
    const busy = state.creating && state.creating.project === state.proj && state.creating.raw;
    if (busy) rows.push({ id: '__new', name: state.creating.roundName, at: Date.now(), busy: true });
    rows.sort((a, b) => (Number(b.pinned) - Number(a.pinned)) || (b.at - a.at));
    list.append(item('all', 'All phases', `${plural(rows.length, 'phase', 'phases')} · ${plural(all.length, 'task', 'tasks')}`, {}));
    for (const r of rows) {
      const n = all.filter((t) => t.batchId === r.id).length;
      list.append(item(r.id, r.name, r.busy ? 'Creating tasks…' : `${fmtDay(r.at)} · ${plural(n, 'task', 'tasks')}`, { menu: !r.busy, pinned: r.pinned, busy: r.busy }));
    }
  }
  async function deletePhase(id) {
    const project = state.proj, bs = projectBatches(project), idx = bs.findIndex((b) => b.id === id);
    if (idx < 0) return;
    if (bs.length === 1) { toast('This is the project\'s only phase. To remove it, delete the project from the sidebar.'); return; }
    const b = bs[idx], name = roundName(b, idx);
    const ts = state.tasks.filter((t) => t.batchId === id && (t.project || '').trim() === project);
    const { id: _bid, ...bdata } = b;
    const saved = [...ts.map(({ id: tid, ...d }) => ['tasks', tid, d]), ['batches', id, { ...bdata, round: name }]];
    // keep the other phases' names as they are ("Phase 3" doesn't become "Phase 2")
    const fixNames = bs.map((x, i) => [x, i]).filter(([x]) => x.id !== id && !String(x.round || '').trim());
    state.deletingRound = id;
    if (state.round === id) { state.round = 'all'; state.keepRound = null; state.hl = null; }
    render();
    try {
      await Promise.all(fixNames.map(([x, i]) => write('batches', x.id, { round: roundName(x, i) }, 'update')));
      await Promise.all(saved.map(([c, did]) => write(c, did, null, 'delete')));
    } catch { state.deletingRound = null; render(); return; }
    state.deletingRound = null;
    render();
    toast(`Deleted ${name} and its ${plural(ts.length, 'task', 'tasks')}`, 'Undo', async () => {
      await Promise.allSettled(saved.map(([c, did, d]) => write(c, did, d, 'set')));
      if (state.proj === project) { state.round = id; state.keepRound = id; }
      render();
      toast(`Restored ${name}.`);
    });
  }
  $('#roundList').addEventListener('scroll', closeMenu);
  $('#side').addEventListener('scroll', closeMenu);

  /* ---------- render all ---------- */
  function render() {
    const ps = projects();
    if (state.proj && !ps.some((p) => p.name === state.proj)) state.proj = '';
    if (!state.proj && ps.length) state.proj = ps[0].name;
    const hasProject = !!state.proj;
    const creatingHere = !!(state.creating && state.creating.project === state.proj);
    // a round just created or edited stays selected while its saved copy arrives
    if (state.round !== 'all' && !(state.round === '__new' && creatingHere) && state.round !== state.keepRound && !state.batches.some((b) => b.id === state.round && (b.project || '').trim() === state.proj)) state.round = 'all';
    $('#page').classList.toggle('solo', !hasProject);
    $('#bar').style.visibility = hasProject && !creatingHere ? 'visible' : 'hidden';
    $('#addProjBtn').hidden = state.readOnly;
    $('#editMsgBtn').hidden = state.readOnly || !!state.creating;
    $('#newRoundBtn').hidden = state.readOnly || !!state.creating;
    renderSidebar(ps);
    if (hasProject) renderTabs();
    renderList();
    if (hasProject) { renderRounds(); renderMessage(false); }
  }

  /* ---------- collapse ---------- */
  const mainEl = $('#main'), colBtn = $('#collapseBtn');
  function setCollapsed(on, save) {
    mainEl.classList.toggle('collapsed', on);
    $('#sidebar').inert = on && !window.matchMedia('(max-width: 820px)').matches;
    const label = on ? 'Show the project list' : 'Hide the project list';
    colBtn.setAttribute('aria-pressed', String(on)); colBtn.setAttribute('aria-label', label); colBtn.title = label;
    if (save) pref.set('collapsed', on ? '1' : '');
  }
  colBtn.onclick = () => { closeMenu(); setCollapsed(!mainEl.classList.contains('collapsed'), true); };
  setCollapsed(pref.get('collapsed') === '1', false);

  /* ---------- events ---------- */
  $('#addProjBtn').onclick = () => openModal('project');
  $('#editMsgBtn').onclick = () => openModal('edit');
  $('#newRoundBtn').onclick = () => openModal('round');
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  document.addEventListener('click', (e) => { if (state.hl && !e.target.closest('.quote, .msg-card, .toast')) setHighlight(null); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (state.menuFor) { const key = state.menuFor; closeMenu(); const b = document.querySelector(`.pmore[data-key="${CSS.escape(key)}"]`); if (b) b.focus(); return; }
    if (!$('#backdrop').hidden) closeModal();
    else if (state.hl) setHighlight(null);
  });
  state.proj = pref.get('proj');

  /* ---------- boot ---------- */
  render();
  const use = (n) => (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
  Promise.all([use('sample'), use('permissions')]).then(async ([s, p]) => {
    sampleFn = s; perms = p;
    if (!s) { smart = 'off'; return; }
    try { const st = p ? await p.state('sample') : 'prompt'; smart = st === 'denied' ? 'denied' : st === 'unavailable' ? 'off' : 'on'; } catch { smart = 'on'; }
  });
  use('user').then(async (u) => {
    if (!u || typeof u.can !== 'function') return;
    try { const w = await u.can('data.write'); if (w === false) { state.readOnly = true; render(); } } catch {}
  });
  use('db').then((d) => {
    if (!d) { state.loaded = true; render(); return; }
    db = d;
    let fresh = false;
    const timer = setTimeout(() => { if (!fresh) { state.loaded = true; render(); toast('Can\'t reach your saved projects yet. They will appear when the connection is back.'); } }, 10000);
    db.collection('tasks').onSnapshot((snap) => {
      state.tasks = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      state.loaded = true;
      if (!snap.metadata.fromCache) { fresh = true; clearTimeout(timer); }
      render();
    }, () => { clearTimeout(timer); state.loaded = true; render(); toast('Saved projects are unavailable right now.'); });
    db.collection('batches').onSnapshot((snap) => {
      state.batches = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
      render();
    }, () => {});
    db.collection('meta').onSnapshot((snap) => {
      state.meta = Object.fromEntries(snap.docs.map((doc) => [doc.id, doc.data()]));
      render();
    }, () => {});
  });
})();
</script>
